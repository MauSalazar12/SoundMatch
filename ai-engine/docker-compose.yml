services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: soundMatch-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER to the existing database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the existing database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB to the existing database name}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  ai-engine:
    build: .
    profiles: [stage3]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://configure-me@postgres:5432/configure-me}
      CLAP_CHECKPOINT: ${CLAP_CHECKPOINT_DOCKER:-/models/music_audioset_epoch_15_esc_90.14.pt}
      CLAP_DEVICE: ${CLAP_DEVICE:-auto}
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-60}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-90}
      CANDIDATE_LIMIT: ${CANDIDATE_LIMIT:-1000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${CLAP_MODELS_PATH:-./models}:/models:ro
      - ${HF_CACHE_PATH:-./models/huggingface}:/cache/huggingface:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 20

  backend:
    build: ../backend
    profiles: [stage3]
    environment:
      AI_ENGINE_URL: http://ai-engine:8000
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-3s}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-100s}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-21037056}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ai-engine:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai-engine_postgres_data}
